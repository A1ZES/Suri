[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

# image processing is ~20x slower unoptimized; keep `tauri dev` previews snappy
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.xtc-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
# no `panic = "abort"`: convert relies on catch_unwind to skip a crashing page

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
